<!DOCTYPE html>

<html> <head> <title>Outpass Management System</title> <link rel="stylesheet" href="style.css"> </head>

<body>

<div class="container">

<h1>Outpass Management System</h1>

<h2>Login</h2>

<form id="loginForm">

    <label>Username</label>
    <input
        type="text"
        id="username"
        placeholder="Enter username"
        required
    >

    <label>Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
    >

    <button type="submit">
        Login
    </button>

    <p id="loginMessage"></p>

</form>

</div>

<script src="script.js"></script>

</body> </html>
